events {}   # required

http {
  # 1. Redirect every HTTP call to HTTPS
  server {
    listen 80;
    server_name tutorai.ddns.net;
    return 301 https://$host$request_uri;
  }

  # 2. MAIN HTTPS SERVER (port 443)
  server {
    listen 443 ssl http2;
    server_name tutorai.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/tutorai.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutorai.ddns.net/privkey.pem;

    # ---- Weaviate REST API (port 8080) ----
    location /v1/ {
      proxy_pass http://localhost:8080/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Transformer FastAPI (port 8000) ----
    location /transformer/ {
      proxy_pass http://localhost:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

     # ---- Main backend FastAPI (port 8001) ----
    location /api/ {
      proxy_pass http://localhost:8001/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # (optional) health-check
    location = / {
      return 200 "OK – nginx SSL proxy running\n";
      add_header Content-Type text/plain;
    }
  }
}